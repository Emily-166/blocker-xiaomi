name: Blocker Xiaomi Auto Build

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. 获取源码
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 配置 JDK
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 配置 Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. 检查 Android SDK
      - name: Check Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      # 5. Gradle 权限
      - name: Grant Execute Permission
        run: chmod +x gradlew

      # 6. 自动修复代码格式
      - name: Auto Format Code
        run: |
          ./gradlew spotlessApply \
            --no-configuration-cache \
            --no-daemon

      # 7. 检查代码格式
      - name: Spotless Check
        run: |
          ./gradlew spotlessCheck \
            --no-configuration-cache \
            --no-daemon

      # 8. 单元测试
      - name: Run Unit Tests
        run: |
          ./gradlew testFossDebugUnitTest \
            --no-configuration-cache \
            --no-daemon

      # 9. 编译 FOSS Release
      - name: Build FOSS Release APK
        run: |
          ./gradlew :app-compose:assembleFossRelease \
            --stacktrace \
            --no-configuration-cache \
            --no-daemon

      # 10. 检查 APK
      - name: Check APK
        run: |
          find app-compose/build/outputs/apk \
            -type f -name "*.apk"

          test -n "$(find app-compose/build/outputs/apk \
            -type f -name "*.apk" -print -quit)"

      # 11. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Blocker-Xiaomi-FOSS-APK
          path: app-compose/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      # 12. 上传测试报告
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Blocker-Xiaomi-Test-Reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results*
          if-no-files-found: ignore
          retention-days: 7
