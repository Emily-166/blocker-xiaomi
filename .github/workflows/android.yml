name: Android APK Auto Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - '**'
      - '!README*'

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 检出源码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 配置 JDK
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 配置 Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 配置 Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 授予执行权限
      - name: Grant Permission
        run: chmod +x gradlew

      # 编译 APK
      - name: Build FOSS Release APK
        run: |
          ./gradlew :app-compose:assembleFossRelease \
            --stacktrace \
            --no-daemon

      # 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Blocker-Xiaomi-APK
          path: |
            app-compose/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
